# Alby Hub reverse proxy (dedicated domain -> internal HTTP port, no SSO).
#
# The internal application port is never exposed to the internet: the ports
# resource keeps it firewall-closed and nginx dials it over localhost. Alby
# Hub's own authentication (locked wallet + Alby account / NWC tokens) is the
# only auth layer - deliberately no YunoHost SSO in front, which would break
# the API / NWC / mobile / extension access patterns (see doc/ADMIN.md).

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;

    # WebSocket support (Alby Hub / NWC-related traffic uses long-lived
    # upgrade + streaming connections).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-poll streaming (payments, channel activity) needs generous
    # timeouts; a tight read timeout would drop idle WebSocket/SSE sessions.
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # NWC connection strings and setup payloads can be sizable; allow a
    # healthy request body without unbounded uploads.
    client_max_body_size 16m;

    # Don't buffer responses (live payment/transaction streams).
    proxy_buffering off;

    proxy_redirect off;
}
